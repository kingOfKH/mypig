<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>StarClick · 历史版本</title>
<style>
  :root {
    /* 与「管理设备」完全一致的冷调石板灰系统 */
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-hover: #f8f9fb;
    --border: rgba(0,0,0,0.06);
    --border-strong: rgba(0,0,0,0.1);

    --text: #0f1115;
    --text-secondary: #525866;
    --text-muted: #8b909a;

    --accent: #5b5bf6;
    --accent-hover: #4848e0;
    --accent-soft: #eef0ff;

    --success: #22c55e;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --danger-border: #fecaca;
    --danger-hover: rgba(239,68,68,0.08);

    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;

    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);

    --font: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font); min-height: 100vh; color: var(--text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    line-height: 1.5; padding: calc(24px + env(safe-area-inset-top)) 24px calc(48px + env(safe-area-inset-bottom));
    background: var(--bg);
  }

  .wrap { width: 100%; max-width: 760px; margin: 0 auto; }

  /* ---------- 页头 ---------- */
  .head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 32px;
  }
  h1 {
    font: 800 28px/1.2 var(--font); letter-spacing: -0.03em; color: var(--text);
  }
  .sub { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }

  .navs { display: flex; gap: 8px; flex-wrap: wrap; }
  .link {
    font: 600 13px/1 var(--font); color: var(--text-secondary); text-decoration: none;
    padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); transition: all 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .link:hover { background: var(--surface-hover); border-color: var(--border-strong); transform: translateY(-1px); }
  .link.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .link.primary:hover { background: #000; }

  /* ---------- 列表 ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    position: relative; background: var(--surface); border-radius: var(--radius-lg);
    padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
    transition: all 0.2s ease; box-shadow: var(--shadow-card); overflow: hidden;
  }
  .item:hover { box-shadow: var(--shadow-card-hover); }
  .item.latest::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }

  .item .info { min-width: 0; flex: 1; }
  .ver {
    font: 700 16px/1.4 var(--font); color: var(--text);
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .ver .code { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .badge {
    display: inline-flex; align-items: center; font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .note { font-size: 13px; color: var(--text-secondary); margin-top: 10px; word-break: break-word; line-height: 1.5; }

  .ops { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .dl, .del {
    padding: 10px 18px; border: none; border-radius: var(--radius-sm); font: 600 13px/1 var(--font);
    cursor: pointer; text-decoration: none; white-space: nowrap; transition: all 0.15s ease;
  }
  .dl { background: var(--text); color: #fff; }
  .dl:hover { background: #000; transform: translateY(-1px); }
  .del { background: var(--surface); color: var(--danger); border: 1px solid var(--danger-border); }
  .del:hover:not(:disabled) { background: var(--danger-soft); }
  .del:disabled { opacity: .5; cursor: default; }

  .empty, .err { text-align: center; color: var(--text-muted); padding: 72px 0; font-size: 14px; }
  .empty .ic { font-size: 44px; display: block; margin-bottom: 14px; opacity: 0.4; }
  .err { color: var(--danger); }

  /* ---------- 确认弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,17,21,0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 50;
  }
  .modal-mask.show { opacity: 1; visibility: visible; }
  .modal {
    position: relative; width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 24px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.06);
    transform: translateY(12px) scale(0.97); transition: transform 0.2s ease;
  }
  .modal-mask.show .modal { transform: translateY(0) scale(1); }
  .modal .m-icon {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 14px;
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-border);
  }
  .modal .m-title { font: 700 16px/1.4 var(--font); color: var(--text); margin-bottom: 8px; }
  .modal .m-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }
  .modal .m-text b { color: var(--text); font-weight: 600; }
  .modal .m-actions { display: flex; gap: 12px; margin-top: 22px; }
  .modal .m-actions button {
    flex: 1; padding: 12px; border-radius: var(--radius-sm); font: 600 14px/1 var(--font);
    cursor: pointer; transition: all 0.15s ease; border: none;
  }
  .modal .m-cancel { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
  .modal .m-cancel:hover { background: var(--surface-hover); }
  .modal .m-ok { background: var(--danger); color: #fff; }
  .modal .m-ok:hover:not(:disabled) { background: #dc2626; }
  .modal .m-ok:disabled { opacity: .6; cursor: default; }

  @media (max-width: 640px) {
    body { padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
    h1 { font-size: 24px; }
    .item { padding: 16px; gap: 14px; flex-wrap: wrap; }
    .ops { width: 100%; justify-content: flex-end; padding-top: 4px; }
    .dl, .del { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>历史版本</h1>
        <div class="sub">所有已发布版本，可单独下载或删除</div>
      </div>
      <div class="navs">
        <a class="link" href="/admin">← 管理页</a>
        <a class="link primary" href="/publish">+ 发布新版本</a>
      </div>
    </div>
    <div id="content"><div class="empty"><span class="ic">🕘</span>加载中…</div></div>
  </div>

  <!-- 自定义删除确认弹窗 -->
  <div class="modal-mask" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="m-icon">⚠️</div>
      <div class="m-title" id="mTitle">确认删除</div>
      <div class="m-text" id="mText"></div>
      <div class="m-actions">
        <button class="m-cancel" id="mCancel">取消</button>
        <button class="m-ok" id="mOk">删除</button>
      </div>
    </div>
  </div>

<script>
  const content = document.getElementById('content');

  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  function fmtDate(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d.getTime())) return s;
    return d.toLocaleString('zh-CN', { hour12: false });
  }

  async function load() {
    try {
      const r = await fetch('/api/app/history');
      const j = await r.json();
      if (!j.success || !j.versions || j.versions.length === 0) {
        content.innerHTML = '<div class="empty"><span class="ic">📭</span>暂无已发布版本</div>';
        return;
      }
      const items = j.versions.map(v => `
        <div class="item${v.isLatest ? ' latest' : ''}">
          <div class="info">
            <div class="ver">v${v.versionName}<span class="code">code ${v.versionCode}</span>${v.isLatest ? '<span class="badge">最新</span>' : ''}</div>
            <div class="meta">
              ${v.publishedAt ? '<span>🕒 ' + fmtDate(v.publishedAt) + '</span>' : ''}
              ${fmtSize(v.size) ? '<span>📦 ' + fmtSize(v.size) + '</span>' : ''}
            </div>
            ${v.note ? '<div class="note">📝 ' + escapeHtml(v.note) + '</div>' : ''}
          </div>
          <div class="ops">
            <a class="dl" href="${v.apkUrl}" download>下载</a>
            <button class="del" data-code="${v.versionCode}" data-name="${escapeHtml(v.versionName)}">删除</button>
          </div>
        </div>
      `).join('');
      content.innerHTML = '<div class="list">' + items + '</div>';
    } catch (e) {
      content.innerHTML = '<div class="err">加载失败：' + escapeHtml(e.message) + '</div>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ===== 自定义确认弹窗：返回 Promise<boolean> =====
  const modal = document.getElementById('modal');
  const mTitle = document.getElementById('mTitle');
  const mText = document.getElementById('mText');
  const mCancel = document.getElementById('mCancel');
  const mOk = document.getElementById('mOk');
  let modalResolve = null;

  function showConfirm(title, text) {
    mTitle.textContent = title;
    mText.innerHTML = text;
    mOk.disabled = false;
    mOk.textContent = '删除';
    modal.classList.add('show');
    return new Promise(resolve => { modalResolve = resolve; });
  }
  function closeModal(result) {
    modal.classList.remove('show');
    if (modalResolve) { modalResolve(result); modalResolve = null; }
  }
  mCancel.addEventListener('click', () => closeModal(false));
  mOk.addEventListener('click', () => closeModal(true));
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('show')) closeModal(false); });

  // 删除按钮（事件委托）：弹出自定义确认框 → 调用 DELETE 接口 → 刷新列表
  content.addEventListener('click', async (e) => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    const code = btn.getAttribute('data-code');
    const name = btn.getAttribute('data-name') || code;
    const ok = await showConfirm(
      '确认删除该版本？',
      '确定要删除版本 <b>v' + escapeHtml(name) + '</b>（code ' + escapeHtml(code) + '）吗？<br>该版本的安装包与记录将被<b>永久删除，且无法恢复</b>。'
    );
    if (!ok) return;
    // 锁定弹窗确认按钮，避免重复提交
    mOk.disabled = true;
    mOk.textContent = '删除中…';
    btn.disabled = true;
    btn.textContent = '删除中…';
    try {
      const r = await fetch(`/api/app/version/${code}`, { method: 'DELETE' });
      const j = await r.json();
      if (!j.success) throw new Error(j.message || '删除失败');
      closeModal(true);
      await load();
    } catch (err) {
      mOk.disabled = false;
      mOk.textContent = '删除';
      alert('删除失败：' + err.message);
      btn.disabled = false;
      btn.textContent = '删除';
    }
  });

  load();
</script>
</body>
</html>
