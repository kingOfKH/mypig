<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>StarClick · 发布新版本</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-hover: #f8f9fb;
    --border: rgba(0,0,0,0.06);
    --border-strong: rgba(0,0,0,0.1);
    
    --text: #0f1115;
    --text-secondary: #525866;
    --text-muted: #8b909a;
    
    /* 冷调靛蓝 */
    --accent: #5b5bf6;
    --accent-hover: #4848e0;
    --accent-soft: #eef0ff;
    
    /* 功能色 */
    --success: #22c55e;
    --success-soft: #f0fdf4;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --shadow-card-hover: 0 4px 16px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
    
    --font: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font); min-height: 100vh; color: var(--text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    display: flex; align-items: center; justify-content: center;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    background: var(--bg);
  }

  .card {
    position: relative; width: 100%; max-width: 460px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
    padding: 36px 32px;
  }

  h1 {
    font: 800 26px/1.2 var(--font); letter-spacing: -0.03em;
    color: var(--text); margin-bottom: 8px;
  }
  .sub { 
    font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; 
    line-height: 1.5;
  }

  /* ---------- 拖拽区 ---------- */
  .drop {
    position: relative; border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 40px 16px; text-align: center; cursor: pointer;
    background: var(--bg); transition: all 0.2s ease;
  }
  .drop:hover, .drop.drag {
    border-color: var(--accent); background: var(--accent-soft);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .drop .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.7; }
  .drop .hint { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
  .drop .file { 
    font-size: 13px; color: var(--accent); margin-top: 10px; 
    word-break: break-all; font-weight: 600; 
  }

  /* ---------- 表单 ---------- */
  .field { margin-top: 20px; }
  .field label {
    display: block; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 8px; font-weight: 600;
  }
  .field input, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px 14px;
    color: var(--text); font: 400 15px var(--font);
    transition: all 0.15s ease;
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-muted); }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 72px; }

  .auto { 
    font-size: 12px; color: var(--success); margin-top: 6px; 
    display: none; font-weight: 600; 
  }
  .auto.show { display: block; }

  /* ---------- 按钮 ---------- */
  .btn-primary {
    width: 100%; margin-top: 28px; padding: 14px 18px; min-height: 48px;
    border: none; border-radius: var(--radius-md);
    background: var(--accent); color: #fff; font: 600 15px/1 var(--font);
    cursor: pointer; letter-spacing: 0.01em;
    box-shadow: 0 4px 12px rgba(91,91,246,0.3);
    transition: all 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) { 
    background: var(--accent-hover); transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(91,91,246,0.4);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { 
    background: var(--text-muted); opacity: .4; cursor: not-allowed; 
    transform: none; box-shadow: none; 
  }

  /* ---------- 消息提示 ---------- */
  .msg {
    margin-top: 16px; font-size: 13px; padding: 12px 14px;
    border-radius: var(--radius-md); display: none; line-height: 1.5; font-weight: 500;
  }
  .msg.show { display: block; animation: fadeIn 0.2s ease; }
  .msg.ok { background: var(--success-soft); color: #16a34a; border: 1px solid rgba(34,197,94,0.15); }
  .msg.err { background: var(--danger-soft); color: #dc2626; border: 1px solid rgba(239,68,68,0.15); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- 底部信息 ---------- */
  .latest {
    margin-top: 24px; font-size: 13px; color: var(--text-muted);
    border-top: 1px solid var(--border); padding-top: 20px; line-height: 1.6;
  }
  .latest b { color: var(--text-secondary); font-weight: 600; }

  .footlinks { margin-top: 16px; display: flex; gap: 8px; }
  .footlinks a {
    flex: 1 1 auto; text-align: center; font: 500 13px/1 var(--font);
    color: var(--text-secondary); text-decoration: none;
    padding: 10px 14px; border-radius: var(--radius-sm);
    transition: all 0.15s ease;
  }
  .footlinks a:hover { background: var(--surface-hover); color: var(--text); }

  /* ---------- 移动端 ---------- */
  @media (max-width: 480px) {
    body { align-items: flex-start; padding: 16px 12px calc(16px + env(safe-area-inset-bottom)); }
    .card { padding: 28px 20px; border-radius: var(--radius-lg); }
    .footlinks { flex-direction: column; }
    .footlinks a { width: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>发布新版本</h1>
    <div class="sub">拖入或选择 APK 文件，版本号将自动从安装包解析</div>

    <div class="drop" id="drop">
      <div class="icon">📦</div>
      <div class="hint">点击选择，或将 APK 拖拽到此处</div>
      <div class="file" id="fileName"></div>
      <input type="file" id="file" accept=".apk" hidden>
    </div>

    <div class="field">
      <label>版本号（自动解析，可覆盖）</label>
      <input type="text" id="versionName" placeholder="如 1.0.1" autocomplete="off">
      <div class="auto" id="autoName">✓ 已从 APK 自动识别</div>
    </div>
    <div class="field">
      <label>版本代码（自动解析，可覆盖）</label>
      <input type="number" id="versionCode" placeholder="如 2" min="1">
      <div class="auto" id="autoCode">✓ 已从 APK 自动识别</div>
    </div>
    <div class="field">
      <label>更新说明（可选）</label>
      <textarea id="note" placeholder="本次更新内容…"></textarea>
    </div>

    <button class="btn-primary" id="publish" disabled>发布</button>
    <div class="msg" id="msg"></div>

    <div class="latest" id="latest">加载当前线上版本…</div>
    <div class="footlinks">
      <a href="/admin">← 返回管理页</a>
      <a href="/versions">查看历史版本 →</a>
    </div>
  </div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const fileName = document.getElementById('fileName');
  const vName = document.getElementById('versionName');
  const vCode = document.getElementById('versionCode');
  const autoName = document.getElementById('autoName');
  const autoCode = document.getElementById('autoCode');
  const note = document.getElementById('note');
  const publishBtn = document.getElementById('publish');
  const msg = document.getElementById('msg');
  const latestEl = document.getElementById('latest');

  let selectedFile = null;
  let parsing = false;

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  // 选择文件：自动上传到服务端解析并回填版本号
  async function handleFile(f) {
    if (!f.name.toLowerCase().endsWith('.apk')) {
      showMsg('请选择 .apk 文件', false); return;
    }
    selectedFile = f;
    fileName.textContent = f.name + '  (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
    publishBtn.disabled = true;
    await parseApk(f);
  }

  // 选文件后自动上传到服务端解析，结果回填到版本号输入框（不发布）。
  async function parseApk(f) {
    if (parsing) return;
    parsing = true;
    autoName.classList.remove('show'); autoCode.classList.remove('show');
    try {
      const fd = new FormData();
      fd.append('apk', f || selectedFile);
      const r = await fetch('/api/app/parse', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.success && j.data) {
        if (j.data.versionName) {
          vName.value = j.data.versionName; autoName.classList.add('show');
        }
        if (j.data.versionCode) {
          vCode.value = j.data.versionCode; autoCode.classList.add('show');
        }
        if (j.data.versionName && j.data.versionCode) {
          publishBtn.disabled = false;
          showMsg('✓ 已解析：v' + j.data.versionName + ' (code ' + j.data.versionCode + ')，确认无误后点发布', true);
        } else {
          showMsg('APK 未解析出完整版本号，请手动填写版本号与版本代码后发布', false);
          publishBtn.disabled = false;
        }
      } else {
        showMsg('解析失败：' + (j.message || '未知错误'), false);
        publishBtn.disabled = false;
      }
    } catch (e) {
      showMsg('解析请求失败：' + e.message, false);
      publishBtn.disabled = false;
    }
    parsing = false;
  }

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  publishBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const fd = new FormData();
    fd.append('apk', selectedFile);
    const vn = vName.value.trim();
    const vc = parseInt(vCode.value.trim(), 10);
    if (!vn || !vc) { showMsg('请先解析或手动填写版本号与版本代码', false); return; }
    fd.append('versionName', vn);
    fd.append('versionCode', String(vc));
    fd.append('note', note.value.trim());
    publishBtn.disabled = true; publishBtn.textContent = '发布中…';
    try {
      const r = await fetch('/api/app/publish', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.success) {
        showMsg('✓ 发布成功！线上版本 ' + j.data.versionName + ' (code ' + j.data.versionCode + ')', true);
        loadLatest();
      } else {
        showMsg('发布失败：' + (j.message || '未知错误'), false);
      }
    } catch (e) {
      showMsg('请求失败：' + e.message, false);
    }
    publishBtn.disabled = false; publishBtn.textContent = '发布';
  });

  async function loadLatest() {
    try {
      const r = await fetch('/api/app/latest');
      const j = await r.json();
      if (j.success && j.data) {
        latestEl.innerHTML = '当前线上版本：<b>v' + j.data.versionName +
          '</b>（code ' + j.data.versionCode + '）' +
          (j.data.publishedAt ? ' · ' + j.data.publishedAt : '');
      } else {
        latestEl.textContent = '暂无已发布版本';
      }
    } catch (e) {
      latestEl.textContent = '无法获取线上版本';
    }
  }
  loadLatest();
</script>
</body>
</html>
