<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarClick · 发布新版本</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg1: #1a1a2e; --bg2: #16213e;
    --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.09);
    --text: #e6e6e6; --muted: #9aa0b4; --muted2: #c0c6dc;
    --brand: #788cff; --brand2: #5a6cff; --brand-grad: linear-gradient(135deg, #788cff, #5a6cff);
    --ok: #8fe093; --ok-bg: rgba(111,191,115,0.15); --ok-border: rgba(111,191,115,0.3);
    --danger: #ff9a9a; --danger-bg: rgba(255,110,110,0.15); --danger-border: rgba(255,110,110,0.3);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(120,140,255,0.12), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(111,191,115,0.08), transparent 55%),
      linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 34px;
    width: 100%; max-width: 460px; backdrop-filter: blur(10px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  h1 {
    font-size: 23px; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px;
    background: linear-gradient(135deg, #fff, #b9c2ff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 26px; }
  .drop {
    border: 2px dashed rgba(120,140,255,0.4); border-radius: 14px; padding: 38px 16px; text-align: center;
    cursor: pointer; transition: all .2s; background: rgba(120,140,255,0.05);
  }
  .drop:hover, .drop.drag {
    border-color: var(--brand); background: rgba(120,140,255,0.14);
    box-shadow: 0 0 0 4px rgba(120,140,255,0.08);
  }
  .drop .icon { font-size: 42px; margin-bottom: 8px; }
  .drop .hint { font-size: 13px; color: var(--muted); }
  .drop .file { font-size: 13px; color: var(--brand); margin-top: 8px; word-break: break-all; font-weight: 600; }
  .field { margin-top: 18px; }
  .field label { display: block; font-size: 13px; color: var(--muted2); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea {
    width: 100%; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px; padding: 11px 13px; color: var(--text); font-size: 14px; font-family: inherit;
    transition: border-color .18s, box-shadow .18s;
  }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(120,140,255,0.15);
  }
  .field .auto { font-size: 12px; color: var(--ok); margin-top: 5px; display: none; }
  .field .auto.show { display: block; }
  textarea { resize: vertical; min-height: 60px; }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  button.pub {
    width: 100%; margin-top: 24px; padding: 13px; border: none; border-radius: 11px;
    background: var(--brand-grad); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .18s ease; box-shadow: 0 6px 18px rgba(90,108,255,0.3);
  }
  button.pub:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(90,108,255,0.45); }
  button.pub:disabled { opacity: .45; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; padding: 11px 13px; border-radius: 9px; display: none; line-height: 1.5; }
  .msg.show { display: block; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-border); }
  .msg.err { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  .latest {
    margin-top: 22px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border);
    padding-top: 16px; line-height: 1.6;
  }
  .latest b { color: #cdd2e6; font-weight: 600; }
  .footlink { margin-top: 16px; text-align: center; }
  .footlink a {
    font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none;
    padding: 8px 16px; border: 1px solid rgba(120,140,255,0.35); border-radius: 10px;
    background: rgba(120,140,255,0.08); transition: all .18s ease; display: inline-block;
  }
  .footlink a:hover { background: rgba(120,140,255,0.18); border-color: var(--brand); transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <h1>StarClick 发布新版本</h1>
    <div class="sub">拖入 / 选择 APK，版本号将自动从安装包解析</div>

    <div class="drop" id="drop">
      <div class="icon">📦</div>
      <div class="hint">点击选择，或将 APK 拖拽到此处</div>
      <div class="file" id="fileName"></div>
      <input type="file" id="file" accept=".apk" hidden>
    </div>

    <div class="field">
      <label>版本号（自动解析，可覆盖）</label>
      <input type="text" id="versionName" placeholder="如 1.0.1" autocomplete="off">
      <div class="auto" id="autoName">✓ 已从 APK 自动识别</div>
    </div>
    <div class="field">
      <label>版本代码（自动解析，可覆盖）</label>
      <input type="number" id="versionCode" placeholder="如 2" min="1">
      <div class="auto" id="autoCode">✓ 已从 APK 自动识别</div>
    </div>
    <div class="field">
      <label>更新说明（可选）</label>
      <textarea id="note" placeholder="本次更新内容…"></textarea>
    </div>

    <div class="actions">
      <button class="pub" id="publish" disabled>发布</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="latest" id="latest">加载当前线上版本…</div>
    <div class="footlink"><a href="/versions">查看历史版本 →</a></div>
  </div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const fileName = document.getElementById('fileName');
  const vName = document.getElementById('versionName');
  const vCode = document.getElementById('versionCode');
  const autoName = document.getElementById('autoName');
  const autoCode = document.getElementById('autoCode');
  const note = document.getElementById('note');
  const publishBtn = document.getElementById('publish');
  const msg = document.getElementById('msg');
  const latestEl = document.getElementById('latest');

  let selectedFile = null;
  let parsing = false;

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  // 选择文件：自动上传到服务端解析并回填版本号
  async function handleFile(f) {
    if (!f.name.toLowerCase().endsWith('.apk')) {
      showMsg('请选择 .apk 文件', false); return;
    }
    selectedFile = f;
    fileName.textContent = f.name + '  (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
    publishBtn.disabled = true;
    await parseApk(f);
  }

  // 选文件后自动上传到服务端解析，结果回填到版本号输入框（不发布）。
  async function parseApk(f) {
    if (parsing) return;
    parsing = true;
    autoName.classList.remove('show'); autoCode.classList.remove('show');
    try {
      const fd = new FormData();
      fd.append('apk', f || selectedFile);
      const r = await fetch('/api/app/parse', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.success && j.data) {
        if (j.data.versionName) {
          vName.value = j.data.versionName; autoName.classList.add('show');
        }
        if (j.data.versionCode) {
          vCode.value = j.data.versionCode; autoCode.classList.add('show');
        }
        if (j.data.versionName && j.data.versionCode) {
          publishBtn.disabled = false;
          showMsg('✓ 已解析：v' + j.data.versionName + ' (code ' + j.data.versionCode + ')，确认无误后点发布', true);
        } else {
          showMsg('APK 未解析出完整版本号，请手动填写版本号与版本代码后发布', false);
          publishBtn.disabled = false;
        }
      } else {
        showMsg('解析失败：' + (j.message || '未知错误'), false);
        publishBtn.disabled = false;
      }
    } catch (e) {
      showMsg('解析请求失败：' + e.message, false);
      publishBtn.disabled = false;
    }
    parsing = false;
  }

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg show ' + (ok ? 'ok' : 'err');
  }

  publishBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const fd = new FormData();
    fd.append('apk', selectedFile);
    const vn = vName.value.trim();
    const vc = parseInt(vCode.value.trim(), 10);
    if (!vn || !vc) { showMsg('请先解析或手动填写版本号与版本代码', false); return; }
    fd.append('versionName', vn);
    fd.append('versionCode', String(vc));
    fd.append('note', note.value.trim());
    publishBtn.disabled = true; publishBtn.textContent = '发布中…';
    try {
      const r = await fetch('/api/app/publish', { method: 'POST', body: fd });
      const j = await r.json();
      if (j.success) {
        showMsg('✓ 发布成功！线上版本 ' + j.data.versionName + ' (code ' + j.data.versionCode + ')', true);
        loadLatest();
      } else {
        showMsg('发布失败：' + (j.message || '未知错误'), false);
      }
    } catch (e) {
      showMsg('请求失败：' + e.message, false);
    }
    publishBtn.disabled = false; publishBtn.textContent = '发布';
  });

  async function loadLatest() {
    try {
      const r = await fetch('/api/app/latest');
      const j = await r.json();
      if (j.success && j.data) {
        latestEl.innerHTML = '当前线上版本：<b>v' + j.data.versionName +
          '</b>（code ' + j.data.versionCode + '）' +
          (j.data.publishedAt ? ' · ' + j.data.publishedAt : '');
      } else {
        latestEl.textContent = '暂无已发布版本';
      }
    } catch (e) {
      latestEl.textContent = '无法获取线上版本';
    }
  }
  loadLatest();
</script>
</body>
</html>
